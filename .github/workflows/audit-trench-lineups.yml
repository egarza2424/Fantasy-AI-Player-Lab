name: Audit Signal 10 historical lineups

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pandas>=2,<3'
      - name: Test historical lineup audit
        run: python test_audit_2025_trench_lineups.py
      - name: Download public 2025 depth charts and schedules
        run: |
          curl --fail --location --retry 3 -o depth_charts_2025.csv \
            https://github.com/nflverse/nflverse-data/releases/download/depth_charts/depth_charts_2025.csv
          curl --fail --location --retry 3 -o schedules.csv \
            https://github.com/nflverse/nflverse-data/releases/download/schedules/games.csv
      - name: Verify input columns
        run: |
          python - <<'PY'
          import pandas as pd
          for file, required in [
              ('depth_charts_2025.csv', {'dt','team','player_name','pos_abb','pos_rank'}),
              ('schedules.csv', {'season','game_type','game_id','week','home_team','away_team','gameday','gametime'})
          ]:
              cols = set(pd.read_csv(file, nrows=2).columns)
              missing = required-cols
              print(file, 'columns:', sorted(cols))
              if missing: raise ValueError(f'{file} missing required columns: {sorted(missing)}')
          PY
      - name: Audit pregame lineup coverage
        run: |
          python audit_2025_trench_lineups.py \
            --depth depth_charts_2025.csv \
            --schedule schedules.csv \
            --output-prefix trench_lineup_audit_2025
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal10-lineup-audit-2025
          path: trench_lineup_audit_2025_*.csv
          if-no-files-found: warn

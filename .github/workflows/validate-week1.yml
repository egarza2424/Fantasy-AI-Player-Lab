name: Validate Week 1 Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-week1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Week 1 validation
        run: python scripts/validate_week1.py

      - name: Commit Week 1 validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 2026-week1-model-validation.csv

          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Add Week 1 Model V1 validation"
            git push
          fi

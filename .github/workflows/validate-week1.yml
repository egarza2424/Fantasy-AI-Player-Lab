name: Validate Week 1 Model

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-week1:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Week 1 validation
        run: |
          python <<'PY'
                    import csv
          import io
          import urllib.request
          from collections import defaultdict

          MODEL_FILE = "2026-week1-reconstructed-model-snapshot.csv"
          OUTPUT_FILE = "2026-week1-model-validation.csv"

          STATS_URL = (
              "https://github.com/nflverse/nflverse-data/releases/download/"
              "player_stats/player_stats.csv"
          )

          print("Loading reconstructed Week 1 model snapshot...")

          with open(MODEL_FILE, newline="", encoding="utf-8") as f:
              model_rows = list(csv.DictReader(f))

          print(f"Loaded {len(model_rows)} model predictions.")

          print("Downloading completed 2026 NFL player stats...")

          request = urllib.request.Request(
              STATS_URL,
              headers={"User-Agent": "Fantasy-AI-Player-Lab"}
          )

          with urllib.request.urlopen(request) as response:
              stats_text = response.read().decode("utf-8")

          stats_rows = list(csv.DictReader(io.StringIO(stats_text)))

          print(f"Downloaded {len(stats_rows)} player-week stat rows.")
                    # Keep only regular-season 2026 Week 1.
          week1_rows = [
              row for row in stats_rows
              if str(row.get("season", "")) == "2026"
              and str(row.get("week", "")) == "1"
              and row.get("season_type", "REG") == "REG"
          ]

          print(f"Found {len(week1_rows)} Week 1 player rows.")

          def number(value):
              try:
                  return float(value or 0)
              except (TypeError, ValueError):
                  return 0.0

          def calculate_ppr(row):
              passing_yards = number(row.get("passing_yards"))
              passing_tds = number(row.get("passing_tds"))
              interceptions = number(row.get("interceptions"))

              rushing_yards = number(row.get("rushing_yards"))
              rushing_tds = number(row.get("rushing_tds"))

              receptions = number(row.get("receptions"))
              receiving_yards = number(row.get("receiving_yards"))
              receiving_tds = number(row.get("receiving_tds"))

              fumbles_lost = number(row.get("fumbles_lost"))

              return (
                  passing_yards * 0.04
                  + passing_tds * 4
                  - interceptions * 2
                  + rushing_yards * 0.10
                  + rushing_tds * 6
                  + receptions
                  + receiving_yards * 0.10
                  + receiving_tds * 6
                  - fumbles_lost * 2
              )

          actual_players = []

          for row in week1_rows:
              position = row.get("position", "")

              if position not in {"QB", "RB", "WR", "TE"}:
                  continue

              actual_players.append({
                  "player_id": row.get("player_id", ""),
                  "player_name": row.get("player_display_name")
                      or row.get("player_name", ""),
                  "position": position,
                  "team": row.get("team", ""),
                  "actual_ppr": round(calculate_ppr(row), 2),
              })

          print(
              f"Calculated PPR results for "
              f"{len(actual_players)} fantasy players."
          )
                    # Rank actual Week 1 performances within each position.
          actual_by_position = defaultdict(list)

          for player in actual_players:
              actual_by_position[player["position"]].append(player)

          for position, players in actual_by_position.items():
              players.sort(
                  key=lambda player: player["actual_ppr"],
                  reverse=True
              )

              for rank, player in enumerate(players, start=1):
                  player["actual_position_rank"] = rank

          # Create lookup tables for matching model predictions
          # to actual Week 1 results.
          actual_by_id = {
              str(player["player_id"]): player
              for player in actual_players
              if player["player_id"]
          }

          def normalize_name(name):
              return (
                  str(name)
                  .lower()
                  .replace(".", "")
                  .replace("'", "")
                  .replace("-", " ")
                  .strip()
              )

          actual_by_name = {
              normalize_name(player["player_name"]): player
              for player in actual_players
              if player["player_name"]
          }

          validation_rows = []
          matched = 0
          unmatched = 0

          for model in model_rows:
              player_id = str(model.get("player_id", ""))

              actual = actual_by_id.get(player_id)

              if actual is None:
                  actual = actual_by_name.get(
                      normalize_name(model.get("player_name", ""))
                  )

              if actual is None:
                  unmatched += 1
                  continue

              matched += 1

              model_rank = int(
                  float(model.get("position_rank", 0) or 0)
              )

              actual_rank = int(
                  actual["actual_position_rank"]
              )

              validation_rows.append({
                  "player_id": player_id,
                  "player_name": model.get("player_name", ""),
                  "position": model.get("position", ""),
                  "team": model.get("team", ""),
                  "model_score": model.get("model_score", ""),
                  "model_rank": model_rank,
                  "recommendation": model.get(
                      "recommendation",
                      ""
                  ),
                  "actual_ppr": actual["actual_ppr"],
                  "actual_position_rank": actual_rank,
                  "rank_difference": actual_rank - model_rank,
              })

          print(f"Matched {matched} model predictions.")
          print(f"Unmatched model predictions: {unmatched}")
                    # Write player-level Week 1 validation results.
          fieldnames = [
              "player_id",
              "player_name",
              "position",
              "team",
              "model_score",
              "model_rank",
              "recommendation",
              "actual_ppr",
              "actual_position_rank",
              "rank_difference",
          ]

          with open(
              OUTPUT_FILE,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:
              writer = csv.DictWriter(
                  f,
                  fieldnames=fieldnames
              )
              writer.writeheader()
              writer.writerows(validation_rows)

          print(
              f"Wrote {len(validation_rows)} rows "
              f"to {OUTPUT_FILE}."
          )

          # ---------- Validation metrics ----------

          def pearson_correlation(xs, ys):
              if len(xs) < 2 or len(xs) != len(ys):
                  return 0.0

              mean_x = sum(xs) / len(xs)
              mean_y = sum(ys) / len(ys)

              numerator = sum(
                  (x - mean_x) * (y - mean_y)
                  for x, y in zip(xs, ys)
              )

              denominator_x = sum(
                  (x - mean_x) ** 2
                  for x in xs
              )

              denominator_y = sum(
                  (y - mean_y) ** 2
                  for y in ys
              )

              denominator = (
                  denominator_x * denominator_y
              ) ** 0.5

              if denominator == 0:
                  return 0.0

              return numerator / denominator

          def rank_values(values):
              indexed = sorted(
                  enumerate(values),
                  key=lambda item: item[1]
              )

              ranks = [0.0] * len(values)
              i = 0

              while i < len(indexed):
                  j = i

                  while (
                      j + 1 < len(indexed)
                      and indexed[j + 1][1]
                      == indexed[i][1]
                  ):
                      j += 1

                  average_rank = (
                      (i + 1) + (j + 1)
                  ) / 2

                  for k in range(i, j + 1):
                      original_index = indexed[k][0]
                      ranks[original_index] = average_rank

                  i = j + 1

              return ranks

          model_scores = [
              float(row["model_score"])
              for row in validation_rows
          ]

          actual_points = [
              float(row["actual_ppr"])
              for row in validation_rows
          ]

          score_ppr_correlation = pearson_correlation(
              model_scores,
              actual_points
          )

          # Spearman correlation between predicted and actual
          # positional ranks. Lower rank numbers are better for both.
          model_ranks = [
              float(row["model_rank"])
              for row in validation_rows
          ]

          actual_ranks = [
              float(row["actual_position_rank"])
              for row in validation_rows
          ]

          spearman = pearson_correlation(
              rank_values(model_ranks),
              rank_values(actual_ranks)
          )

          print("")
          print("===== MODEL V1 WEEK 1 VALIDATION =====")
          print(f"Matched players: {matched}")
          print(f"Unmatched predictions: {unmatched}")
          print(
              "Model Score vs Actual PPR correlation: "
              f"{score_ppr_correlation:.3f}"
          )
          print(
              "Predicted Rank vs Actual Rank "
              f"Spearman correlation: {spearman:.3f}"
          )
                    print("")
          print("===== PERFORMANCE BY POSITION =====")

          position_metrics = {}

          for position in ["QB", "RB", "WR", "TE"]:
              position_rows = [
                  row for row in validation_rows
                  if row["position"] == position
              ]

              if len(position_rows) < 2:
                  continue

              position_scores = [
                  float(row["model_score"])
                  for row in position_rows
              ]

              position_points = [
                  float(row["actual_ppr"])
                  for row in position_rows
              ]

              position_model_ranks = [
                  float(row["model_rank"])
                  for row in position_rows
              ]

              position_actual_ranks = [
                  float(row["actual_position_rank"])
                  for row in position_rows
              ]

              score_corr = pearson_correlation(
                  position_scores,
                  position_points
              )

              rank_corr = pearson_correlation(
                  rank_values(position_model_ranks),
                  rank_values(position_actual_ranks)
              )

              average_rank_error = (
                  sum(
                      abs(
                          float(row["actual_position_rank"])
                          - float(row["model_rank"])
                      )
                      for row in position_rows
                  )
                  / len(position_rows)
              )

              position_metrics[position] = {
                  "players": len(position_rows),
                  "score_correlation": score_corr,
                  "rank_correlation": rank_corr,
                  "average_rank_error": average_rank_error,
              }

              print(
                  f"{position}: "
                  f"{len(position_rows)} players | "
                  f"Score/PPR r={score_corr:.3f} | "
                  f"Rank rho={rank_corr:.3f} | "
                  f"Avg rank error={average_rank_error:.1f}"
              )

          # ---------- Recommendation analysis ----------

          print("")
          print("===== START / FLEX / SIT RESULTS =====")

          recommendation_groups = defaultdict(list)

          for row in validation_rows:
              recommendation_groups[
                  row["recommendation"]
              ].append(float(row["actual_ppr"]))

          recommendation_metrics = {}

          for recommendation in ["START", "FLEX", "SIT"]:
              points = recommendation_groups.get(
                  recommendation,
                  []
              )

              if not points:
                  continue

              average_ppr = sum(points) / len(points)

              recommendation_metrics[recommendation] = {
                  "players": len(points),
                  "average_ppr": average_ppr,
              }

              print(
                  f"{recommendation}: "
                  f"{len(points)} players | "
                  f"Average PPR={average_ppr:.2f}"
              )

          # ---------- Biggest ranking hits / misses ----------

          ranked_differences = sorted(
              validation_rows,
              key=lambda row: abs(
                  int(row["rank_difference"])
              ),
              reverse=True
          )

          print("")
          print("===== LARGEST RANK DIFFERENCES =====")

          for row in ranked_differences[:15]:
              print(
                  f'{row["player_name"]} ({row["position"]}) | '
                  f'Model {row["model_rank"]} -> '
                  f'Actual {row["actual_position_rank"]} | '
                  f'{row["actual_ppr"]} PPR | '
                  f'Difference {row["rank_difference"]:+d}'
              )
PY

      - name: Commit Week 1 validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add 2026-week1-model-validation.csv

          if git diff --cached --quiet; then
            echo "No validation changes to commit."
          else
            git commit -m "Add Week 1 Model V1 validation"
            git push
          fi

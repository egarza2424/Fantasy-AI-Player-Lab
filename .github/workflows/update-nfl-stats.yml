name: Update NFL Stats

on:
  workflow_dispatch:
    inputs:
      target_week:
        description: "Optional 2026 week to lock matchup data to"
        required: false
        default: ""
  schedule:
    - cron: "0 12 * * *"
permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
      TARGET_WEEK: ${{ github.event.inputs.target_week || '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and convert NFL stats
        run: |
          python <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone          
          target_week_raw = os.environ.get(
              "TARGET_WEEK",
              ""
          ).strip()

          target_week = (
              int(target_week_raw)
              if target_week_raw
              else None
          )

          if target_week is not None:
              print(
                  f"Matchup schedule locked to "
                  f"2026 Week {target_week}."
              )
          else:
              print(
                  "Matchup schedule using live "
                  "next-opponent mode."
              )

          seasons = [2026, 2025]
          # -------------------------------------------------
          # COACHING / PLAY-CALLER DATA
          # -------------------------------------------------

          with open(
              "coordinators.json",
              "r",
              encoding="utf-8"
          ) as file:
              coaching_data = json.load(file)

          expected_seasons = {
              "2022",
              "2023",
              "2024",
              "2025",
              "2026"
          }

          missing_seasons = (
              expected_seasons -
              set(coaching_data.keys())
          )

          if missing_seasons:
              raise RuntimeError(
                  "Missing coaching seasons: "
                  f"{sorted(missing_seasons)}"
              )

          expected_teams = 32

          for season in sorted(expected_seasons):
              team_count = len(
                  coaching_data.get(season, {})
              )

              if team_count != expected_teams:
                  raise RuntimeError(
                      f"{season} coaching data has "
                      f"{team_count} teams instead of 32."
                  )

          print(
              "Loaded coaching/play-caller data "
              f"for {len(coaching_data)} seasons."
          )
          selected_fields = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "position_group",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds"
          ]
          def calculate_ppr_points(row):
              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              return (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )
          def normalize_matchup_score(
              value,
              values
          ):
              if value is None or not values:
                  return 50

              minimum = min(values)
              maximum = max(values)

              if maximum <= minimum:
                  return 50

              normalized = (
                  (
                      float(value) - minimum
                  ) /
                  (
                      maximum - minimum
                  )
              )

              score = round(
                  25 + normalized * 75
              )

              return max(
                  0,
                  min(100, score)
              )
              
          rows = []
          season_used = None

          for season in seasons:
              stats_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  f"releases/download/stats_player/stats_player_week_{season}.csv"
              )

              print(f"Trying player stats: {stats_url}")

              try:
                  with urllib.request.urlopen(stats_url) as response:
                      content = response.read().decode("utf-8")

                  reader = csv.DictReader(io.StringIO(content))

                  season_rows = []

                  for row in reader:
                      if row.get("position") not in {"QB", "RB", "WR", "TE"}:
                          continue

                      if row.get("season_type") not in {"REG", ""}:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      clean_row["red_zone_pass_attempts"] = 0
                      clean_row["red_zone_carries"] = 0
                      clean_row["red_zone_targets"] = 0

                      season_rows.append(clean_row)

                  if season_rows:
                      rows = season_rows
                      season_used = season

                      print(
                          f"Loaded {len(rows)} player-week records "
                          f"for {season}"
                      )

                      break

              except Exception as error:
                  print(f"{season} player stats unavailable: {error}")

          if not rows:
              raise RuntimeError(
                  "No NFL player stats could be downloaded."
              )
          # -------------------------------------------------
          # COMPLETED 2026 PLAYER-WEEK DATA
          # Use completed 2026 weeks as rolling model history.
          # Never include the target prediction week itself.
          # -------------------------------------------------

          completed_2026_rows = []

          if season_used == 2026:
              available_2026_weeks = []

              for row in rows:
                  try:
                      row_week = int(
                          float(row.get("week") or 0)
                      )
                  except (TypeError, ValueError):
                      continue

                  if row_week > 0:
                      available_2026_weeks.append(row_week)

              if target_week is not None:
                  history_cutoff_week = target_week
              elif available_2026_weeks:
                  history_cutoff_week = max(
                      available_2026_weeks
                  ) + 1
              else:
                  history_cutoff_week = 1

              for row in rows:
                  try:
                      row_week = int(
                          float(row.get("week") or 0)
                      )
                  except (TypeError, ValueError):
                      continue

                  if row_week >= history_cutoff_week:
                      continue

                  completed_2026_rows.append(
                      dict(row)
                  )

          print(
              f"Added {len(completed_2026_rows)} completed "
              "2026 player-week records to rolling history."
          )
          # -------------------------------------------------
          # HISTORICAL PLAYER-WEEK DATA
          # 2022-2025 for coaching matchup calculations
          # -------------------------------------------------

          historical_rows = []

          historical_seasons = [
              2022,
              2023,
              2024,
              2025
          ]

          for historical_season in historical_seasons:
              historical_url = (
                  "https://github.com/nflverse/"
                  "nflverse-data/releases/download/"
                  "stats_player/"
                  f"stats_player_week_{historical_season}.csv"
              )

              print(
                  "Trying historical player stats: "
                  f"{historical_url}"
              )

              try:
                  with urllib.request.urlopen(
                      historical_url
                  ) as response:
                      historical_content = (
                          response.read().decode("utf-8")
                      )

                  historical_reader = csv.DictReader(
                      io.StringIO(historical_content)
                  )

                  season_record_count = 0

                  for row in historical_reader:
                      if row.get("position") not in {
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      }:
                          continue

                      if row.get("season_type") not in {
                          "REG",
                          ""
                      }:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      historical_rows.append(
                          clean_row
                      )

                      season_record_count += 1

                  print(
                      f"Loaded {season_record_count} "
                      "historical player-week records "
                      f"for {historical_season}."
                  )

              except Exception as error:
                  raise RuntimeError(
                      "Historical player stats unavailable "
                      f"for {historical_season}: {error}"
                  )

          # Add only completed 2026 weeks to the historical
          # dataset used by rolling model signals.
          historical_rows.extend(
              dict(row)
              for row in completed_2026_rows
          )

          print(
              "Loaded "
              f"{len(historical_rows)} total historical "
              "player-week records for 2022-2026 "
              "(completed weeks only)."
          )
          
          # -------------------------------------------------
          # ATTACH HISTORICAL COACHING / PLAY-CALLER DATA
          # -------------------------------------------------

          coaching_records_matched = 0
          coaching_records_missing = 0

          for row in historical_rows:
              season = str(row.get("season") or "")
              offense_team = row.get("team")
              defense_team = row.get("opponent_team")
              if offense_team == "LA":
                  offense_team = "LAR"

              if defense_team == "LA":
                  defense_team = "LAR"

              season_coaches = coaching_data.get(
                  season,
                  {}
              )

              offense_coaches = season_coaches.get(
                  offense_team,
                  {}
              )

              defense_coaches = season_coaches.get(
                  defense_team,
                  {}
              )

              row["offensive_coordinator"] = (
                  offense_coaches.get(
                      "offensive_coordinator"
                  )
              )

              row["offensive_play_caller"] = (
                  offense_coaches.get(
                      "offensive_play_caller"
                  )
              )

              row["defensive_coordinator"] = (
                  defense_coaches.get(
                      "defensive_coordinator"
                  )
              )

              row["defensive_play_caller"] = (
                  defense_coaches.get(
                      "defensive_play_caller"
                  )
              )

              if (
                  row["offensive_play_caller"] and
                  row["defensive_play_caller"]
              ):
                  coaching_records_matched += 1
              else:
                  coaching_records_missing += 1

          print(
              "Attached coaching data to "
              f"{coaching_records_matched} "
              "historical player-week records."
          )

          print(
              "Historical records missing a play caller: "
              f"{coaching_records_missing}."
          )
          # -------------------------------------------------
          # DIAGNOSE MISSING COACHING MAPPINGS
          # -------------------------------------------------

          missing_mapping_counts = defaultdict(int)

          for row in historical_rows:
              if (
                  row.get("offensive_play_caller") and
                  row.get("defensive_play_caller")
              ):
                  continue

              season = str(row.get("season") or "")
              offense_team = row.get("team") or "UNKNOWN"
              defense_team = (
                  row.get("opponent_team") or "UNKNOWN"
              )

              if not row.get("offensive_play_caller"):
                  key = (
                      season,
                      "OFFENSE",
                      offense_team
                  )

                  missing_mapping_counts[key] += 1

              if not row.get("defensive_play_caller"):
                  key = (
                      season,
                      "DEFENSE",
                      defense_team
                  )

                  missing_mapping_counts[key] += 1

          print(
              "Missing coaching mappings by "
              "season/team:"
          )

          for (
              season,
              side,
              team
          ), count in sorted(
              missing_mapping_counts.items()
          ):
              print(
                  f"{season} {side} {team}: "
                  f"{count}"
              )
          # -------------------------------------------------
          # HISTORICAL PLAY-CALLER MATCHUP PPR
          # -------------------------------------------------

          play_caller_game_totals = defaultdict(float)

          for row in historical_rows:
              offensive_play_caller = row.get(
                  "offensive_play_caller"
              )

              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )

              position = row.get("position")
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not offensive_play_caller or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              game_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position,
                  season,
                  week
              )

              play_caller_game_totals[
                  game_key
              ] += fantasy_points

          play_caller_matchup_history = defaultdict(
              list
          )

          for (
              offensive_play_caller,
              defensive_play_caller,
              position,
              season,
              week
          ), fantasy_points in (
              play_caller_game_totals.items()
          ):
              matchup_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position
              )

              play_caller_matchup_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  )
              })

          for matchup_games in (
              play_caller_matchup_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          play_caller_matchups = {}

          for matchup_key, matchup_games in (
              play_caller_matchup_history.items()
          ):
              recent_games = matchup_games[:4]

              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              key_string = "|".join(
                  matchup_key
              )

              play_caller_matchups[
                  key_string
              ] = {
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": recent_games
              }

          print(
              "Created "
              f"{len(play_caller_matchups)} "
              "historical play-caller matchup "
              "profiles."
          )
          # -------------------------------------------------
          # PLAYER VS DEFENSIVE PLAY-CALLER PPR
          # -------------------------------------------------

          player_vs_defensive_caller_history = defaultdict(
              list
          )

          for row in historical_rows:
              player_id = row.get("player_id")
              player_name = (
                  row.get("player_display_name") or
                  row.get("player_name")
              )
              position = row.get("position")
              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not player_id or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              matchup_key = (
                  player_id,
                  defensive_play_caller
              )

              player_vs_defensive_caller_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  ),
                  "player_name": player_name,
                  "position": position
              })

          for matchup_games in (
              player_vs_defensive_caller_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          player_vs_defensive_caller = {}

          for matchup_key, matchup_games in (
              player_vs_defensive_caller_history.items()
          ):
              recent_games = matchup_games[:4]

              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              player_id, defensive_play_caller = (
                  matchup_key
              )

              key_string = (
                  f"{player_id}|"
                  f"{defensive_play_caller}"
              )

              player_vs_defensive_caller[
                  key_string
              ] = {
                  "player_name":
                      recent_games[0][
                          "player_name"
                      ],
                  "position":
                      recent_games[0][
                          "position"
                      ],
                  "defensive_play_caller":
                      defensive_play_caller,
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": [
                      {
                          "season":
                              game["season"],
                          "week":
                              game["week"],
                          "ppr_points":
                              game["ppr_points"]
                      }
                      for game in recent_games
                  ]
              }

          print(
              "Created "
              f"{len(player_vs_defensive_caller)} "
              "player-vs-defensive-play-caller "
              "profiles."
          )
          red_zone_seasons = {2025}

          if season_used:
              red_zone_seasons.add(
                  season_used
              )

          if completed_2026_rows:
              red_zone_seasons.add(2026)

          red_zone_stats = defaultdict(
              lambda: {
                  "red_zone_pass_attempts": 0,
                  "red_zone_carries": 0,
                  "red_zone_targets": 0
              }
          )

          for red_zone_season in sorted(
              red_zone_seasons
          ):
              pbp_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  "releases/download/pbp/"
                  f"play_by_play_{red_zone_season}.csv.gz"
              )

              print(
                  f"Trying play-by-play: {pbp_url}"
              )

              with urllib.request.urlopen(
                  pbp_url
              ) as response:
                  compressed = response.read()

              content = gzip.decompress(
                  compressed
              ).decode("utf-8")

              reader = csv.DictReader(
                  io.StringIO(content)
              )

              for play in reader:
                  if play.get("season_type") != "REG":
                      continue

                  try:
                      yardline = float(
                          play.get("yardline_100") or 999
                      )
                  except (TypeError, ValueError):
                      continue

                  if yardline > 20:
                      continue

                  week = play.get("week")
                  team = play.get("posteam")

                  if not week or not team:
                      continue

                  try:
                      play_week = int(
                          float(week)
                      )
                  except (TypeError, ValueError):
                      continue

                  if (
                      target_week is not None and
                      red_zone_season == 2026 and
                      play_week >= target_week
                  ):
                      continue

                  passer_id = play.get(
                      "passer_player_id"
                  )
                  rusher_id = play.get(
                      "rusher_player_id"
                  )
                  receiver_id = play.get(
                      "receiver_player_id"
                  )

                  pass_attempt = (
                      play.get("pass_attempt") == "1"
                  )

                  rush_attempt = (
                      play.get("rush_attempt") == "1"
                  )

                  if pass_attempt and passer_id:
                      key = (
                          str(red_zone_season),
                          passer_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_pass_attempts"
                      ] += 1

                  if rush_attempt and rusher_id:
                      key = (
                          str(red_zone_season),
                          rusher_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_carries"
                      ] += 1

                  if pass_attempt and receiver_id:
                      key = (
                          str(red_zone_season),
                          receiver_id,
                          str(play_week)
                      )

                      red_zone_stats[key][
                          "red_zone_targets"
                      ] += 1

          matched = 0

          historical_matched_by_season = defaultdict(
              int
          )

          for row in rows:
              row_season = str(
                  row.get("season") or
                  season_used or
                  ""
              )

              player_id = row.get("player_id")
              week = str(row.get("week") or "")

              key = (
                  row_season,
                  player_id,
                  week
              )

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)
                  matched += 1

          for row in historical_rows:
              row_season = str(
                  row.get("season") or ""
              )

              if row_season not in {
                  "2025",
                  "2026"
              }:
                  continue

              row["red_zone_pass_attempts"] = 0
              row["red_zone_carries"] = 0
              row["red_zone_targets"] = 0

              player_id = row.get("player_id")
              week = str(row.get("week") or "")

              key = (
                  row_season,
                  player_id,
                  week
              )

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)

                  historical_matched_by_season[
                      row_season
                  ] += 1

          print(
              "Matched red-zone stats to "
              f"{matched} current player-week rows."
          )

          for red_zone_season in {
              "2025",
              "2026"
          }:
              season_match_count = (
                  historical_matched_by_season.get(
                      red_zone_season,
                      0
                  )
              )

              print(
                  "Matched red-zone stats to "
                  f"{season_match_count} historical "
                  "player-week rows for "
                  f"{red_zone_season}."
              )
          # -------------------------------------------------
          # MATCHUP DATA
          # Calculate rolling 2025-2026 fantasy points
          # allowed per game by each defense to
          # QB, RB, WR and TE.
          # -------------------------------------------------

          defense_position_totals = defaultdict(
              lambda: {
                  "fantasy_points": 0.0,
                  "games": set()
              }
          )

          for row in historical_rows:
              row_season = str(
                  row.get("season") or ""
              )

              if row_season not in {
                  "2025",
                  "2026"
              }:
                  continue

              defense = row.get("opponent_team")

              if defense == "LA":
                  defense = "LAR"

              position = row.get("position")
              week = str(row.get("week") or "")

              game_id = (
                  f"{row_season}-{week}"
              )

              if (
                  not defense or
                  position not in {"QB", "RB", "WR", "TE"} or
                  not week
              ):
                  continue

              fantasy_points = (
                  calculate_ppr_points(row)
              )
              key = (defense, position)

              defense_position_totals[key][
                  "fantasy_points"
              ] += fantasy_points

              defense_position_totals[key][
                  "games"
              ].add(game_id)

          defense_position_allowed = {}

          for (defense, position), data in (
              defense_position_totals.items()
          ):
              game_count = len(data["games"])

              if game_count == 0:
                  continue

              if defense not in defense_position_allowed:
                  defense_position_allowed[defense] = {}

              defense_position_allowed[defense][position] = round(
                  data["fantasy_points"] / game_count,
                  2
              )

          print(
              f"Created defensive matchup data for "
              f"{len(defense_position_allowed)} teams."
          )

          defense_matchup_position_values = {
              "QB": [],
              "RB": [],
              "WR": [],
              "TE": []
          }

          for defense_data in (
              defense_position_allowed.values()
          ):
              for position in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  fantasy_points_allowed = (
                      defense_data.get(position)
                  )

                  if fantasy_points_allowed is not None:
                      defense_matchup_position_values[
                          position
                      ].append(
                          float(fantasy_points_allowed)
                      )

          # -------------------------------------------------
          # 2026 CURRENT / NEXT OPPONENT DATA
          # -------------------------------------------------
          schedule_url = (
              "https://raw.githubusercontent.com/"
              "nflverse/nfldata/master/data/games.csv"
          )

          print(f"Trying schedule data: {schedule_url}")

          with urllib.request.urlopen(schedule_url) as response:
              schedule_content = (
                  response.read().decode("utf-8")
              )

          schedule_reader = csv.DictReader(
              io.StringIO(schedule_content)
          )

          upcoming_games = []

          for game in schedule_reader:
              if str(game.get("season")) != "2026":
                  continue

              if game.get("game_type") not in {"REG", ""}:
                  continue

              gameday = game.get("gameday")

              if not gameday:
                  continue

              try:
                  game_date = datetime.strptime(
                      gameday,
                      "%Y-%m-%d"
                  ).date()
              except ValueError:
                  continue

              game_week = int(
                  game.get("week") or 0
              )

              if target_week is not None:
                  if game_week != target_week:
                      continue
              else:
                  away_score = game.get("away_score")
                  home_score = game.get("home_score")

                  game_completed = (
                      away_score not in {
                          None,
                          ""
                      } and
                      home_score not in {
                          None,
                          ""
                      }
                  )

                  if game_completed:
                      continue

              away_team = game.get("away_team")
              home_team = game.get("home_team")

              if not away_team or not home_team:
                  continue

              upcoming_games.append({
                  "date": game_date,
                  "week": game_week,
                  "away_team": away_team,
                  "home_team": home_team
              })
          upcoming_games.sort(
              key=lambda game: (
                  game["date"],
                  game["week"]
              )
          )

          team_next_opponent = {}

          for game in upcoming_games:
              away_team = game["away_team"]
              home_team = game["home_team"]

              if away_team == "LA":
                  away_team = "LAR"

              if home_team == "LA":
                  home_team = "LAR"

              if away_team not in team_next_opponent:
                  team_next_opponent[away_team] = {
                      "opponent": home_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "away"
                  }

              if home_team not in team_next_opponent:
                  team_next_opponent[home_team] = {
                      "opponent": away_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "home"
                  }

          print(
              f"Created next-opponent data for "
              f"{len(team_next_opponent)} teams."
          )
          # -------------------------------------------------
          # 2026 PLAY-CALLER MATCHUP SIGNALS
          # -------------------------------------------------

          current_coaching = coaching_data.get(
              "2026",
              {}
          )

          current_play_caller_signals = {}

          signal_counts = {
              "teams_with_matchup": 0,
              "play_caller_history": 0,
              "play_caller_no_history": 0
          }

          for team, matchup in (
              team_next_opponent.items()
          ):
              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )
              
              opponent = matchup.get(
                  "opponent"
              )

              normalized_opponent = (
                  "LAR"
                  if opponent == "LA"
                  else opponent
              )

              offense_staff = (
                  current_coaching.get(
                      normalized_team,
                      {}
                  )
              )

              defense_staff = (
                  current_coaching.get(
                      normalized_opponent,
                      {}
                  )
              )

              offensive_play_caller = (
                  offense_staff.get(
                      "offensive_play_caller"
                  )
              )

              defensive_play_caller = (
                  defense_staff.get(
                      "defensive_play_caller"
                  )
              )

              team_signal = {
                  "opponent":
                     opponent,
                  "week":
                      matchup.get("week"),
                  "offensive_coordinator":
                      offense_staff.get(
                          "offensive_coordinator"
                      ),
                  "offensive_play_caller":
                      offensive_play_caller,
                  "opponent_defensive_coordinator":
                      defense_staff.get(
                          "defensive_coordinator"
                      ),
                  "opponent_defensive_play_caller":
                      defensive_play_caller,
                  "positions": {}
              }

              if (
                  offensive_play_caller and
                  defensive_play_caller
              ):
                  signal_counts[
                      "teams_with_matchup"
                  ] += 1

              for position in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  history_key = "|".join([
                      offensive_play_caller or "",
                      defensive_play_caller or "",
                      position
                  ])

                  history = (
                      play_caller_matchups.get(
                          history_key
                      )
                  )

                  if history:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr":
                              history.get(
                                  "average_ppr"
                              ),
                          "sample_size":
                              history.get(
                                  "sample_size"
                              ),
                          "games":
                              history.get(
                                  "games",
                                  []
                              )
                      }

                      signal_counts[
                          "play_caller_history"
                      ] += 1

                  else:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr": None,
                          "sample_size": 0,
                          "games": []
                      }

                      signal_counts[
                          "play_caller_no_history"
                      ] += 1

              current_play_caller_signals[
                  team
              ] = team_signal

          print(
              "Created current play-caller signals "
              f"for {len(current_play_caller_signals)} "
              "teams."
          )

          print(
              "2026 teams with both play callers: "
              f"{signal_counts['teams_with_matchup']}."
          )

          print(
              "Position matchups with historical "
              "play-caller data: "
              f"{signal_counts['play_caller_history']}."
          )

          print(
              "Position matchups without historical "
              "play-caller data: "
              f"{signal_counts['play_caller_no_history']}."
          )
          # -------------------------------------------------
          # 2026 PLAYER VS DEFENSIVE PLAY-CALLER SIGNALS
          # -------------------------------------------------

          current_player_vs_defensive_caller = {}
          
          if target_week is not None:
              player_signal_source_rows = (
                  completed_2026_rows
              )
          else:
              player_signal_source_rows = rows

          player_signal_source_weeks = sorted({
              int(float(row.get("week") or 0))
              for row in player_signal_source_rows
              if row.get("week")
          })

          print(
              "Player-signal source weeks: "
              f"{player_signal_source_weeks}."
          )

          if target_week is not None:
              leaked_player_signal_weeks = [
                  week
                  for week in player_signal_source_weeks
                  if week >= target_week
              ]

              if leaked_player_signal_weeks:
                  raise RuntimeError(
                      "Fixed-week player-signal leakage "
                      "detected. Source contains target "
                      "or future weeks: "
                      f"{leaked_player_signal_weeks}"
                  )
                  
          current_player_ids = {
              row.get("player_id")
              for row in player_signal_source_rows
              if row.get("player_id")
          }
          current_player_defensive_matchup = {}

          for player_id in current_player_ids:
              player_rows = [
                  row
                  for row in player_signal_source_rows
                  if row.get("player_id") == player_id
              ]

              if not player_rows:
                  continue

              latest_player_row = max(
                  player_rows,
                  key=lambda row: int(
                      float(row.get("week") or 0)
                  )
              )

              position = latest_player_row.get(
                  "position"
              )

              team = latest_player_row.get(
                  "team"
              )

              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              team_matchup = team_next_opponent.get(
                  normalized_team
              )

              if not team_matchup:
                  current_player_defensive_matchup[
                      player_id
                  ] = {
                      "position": position,
                      "team": team,
                      "opponent": None,
                      "fantasy_points_allowed": None,
                      "score": 50,
                      "score_source":
                          "neutral_no_upcoming_matchup"
                  }

                  continue

              opponent = team_matchup.get(
                  "opponent"
              )

              normalized_opponent = (
                  "LAR"
                  if opponent == "LA"
                  else opponent
              )

              defense_data = (
                  defense_position_allowed.get(
                      normalized_opponent,
                      {}
                  )
              )

              fantasy_points_allowed = (
                  defense_data.get(position)
              )

              values = (
                  defense_matchup_position_values.get(
                      position,
                      []
                  )
              )

              if fantasy_points_allowed is None:
                  score = 50
                  score_source = (
                      "neutral_no_defensive_history"
                  )
              else:
                  score = normalize_matchup_score(
                      fantasy_points_allowed,
                      values
                  )
                  score_source = (
                      "defense_ppr_allowed_"
                      "position_normalized"
                  )

              current_player_defensive_matchup[
                  player_id
              ] = {
                  "position": position,
                  "team": team,
                  "opponent": opponent,
                  "fantasy_points_allowed":
                      fantasy_points_allowed,
                  "score": score,
                  "score_source": score_source
              }

          if (
              len(current_player_defensive_matchup) !=
              len(current_player_ids)
          ):
              raise RuntimeError(
                  "Defensive-matchup current-player "
                  "count does not match current player pool. "
                  f"Scores: "
                  f"{len(current_player_defensive_matchup)}, "
                  f"players: {len(current_player_ids)}."
              )

          invalid_defensive_matchup_scores = []
          invalid_defensive_matchup_opponents = []

          for (
              player_id,
              matchup
          ) in current_player_defensive_matchup.items():
              score = matchup.get("score")
              team = matchup.get("team")
              opponent = matchup.get("opponent")

              if (
                  score is None or
                  score < 0 or
                  score > 100
              ):
                  invalid_defensive_matchup_scores.append(
                      player_id
                  )

              normalized_validation_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              expected_team_matchup = (
                  team_next_opponent.get(
                      normalized_validation_team
                  )
              )

              expected_opponent = (
                  expected_team_matchup.get("opponent")
                  if expected_team_matchup
                  else None
              )

              if opponent != expected_opponent:
                  invalid_defensive_matchup_opponents.append(
                      (
                          player_id,
                          opponent,
                          expected_opponent
                      )
                  )

              if (
                  matchup.get("score_source") in {
                      "neutral_no_upcoming_matchup",
                      "neutral_no_defensive_history"
                  } and
                  score != 50
              ):
                  invalid_defensive_matchup_scores.append(
                      player_id
                  )

          if invalid_defensive_matchup_scores:
              raise RuntimeError(
                  "Invalid defensive-matchup scores for: "
                  f"{invalid_defensive_matchup_scores[:10]}"
              )

          if invalid_defensive_matchup_opponents:
              raise RuntimeError(
                  "Defensive-matchup opponent mismatch for: "
                  f"{invalid_defensive_matchup_opponents[:10]}"
              )

          defensive_matchup_neutral_count = sum(
              1
              for matchup in (
                  current_player_defensive_matchup.values()
              )
              if matchup.get("score_source") in {
                  "neutral_no_upcoming_matchup",
                  "neutral_no_defensive_history"
              }
          )

          print(
              "Created position-normalized defensive-"
              "matchup scores for "
              f"{len(current_player_defensive_matchup)} "
              "current players."
          )

          print(
              "Current players with neutral defensive-"
              "matchup scores: "
              f"{defensive_matchup_neutral_count}."
          )

          for position in {
              "QB",
              "RB",
              "WR",
              "TE"
          }:
              position_scores = [
                  matchup.get("score")
                  for matchup in (
                      current_player_defensive_matchup.values()
                  )
                  if (
                      matchup.get("position") == position and
                      matchup.get("score") is not None
                  )
              ]

              if position_scores:
                  print(
                      f"Defensive-matchup {position} "
                      "score range: "
                      f"{min(position_scores)}-"
                      f"{max(position_scores)} "
                      f"across {len(position_scores)} "
                      "players."
                  )

          print(
              "Validated defensive-matchup scores for "
              f"{len(current_player_defensive_matchup)} "
              "current players."
          )

          player_signal_counts = {
              "players_checked": 0,
              "with_history": 0,
              "without_history": 0,
              "without_upcoming_matchup": 0
          }

          for player_id in current_player_ids:
              player_rows = [
                  row
                  for row in player_signal_source_rows
                  if row.get("player_id") == player_id
              ]

              if not player_rows:
                  continue

              latest_player_row = max(
                  player_rows,
                  key=lambda row: int(
                      float(row.get("week") or 0)
                  )
              )
              
              latest_player_week = int(
                  float(
                      latest_player_row.get("week") or 0
                  )
              )

              if (
                  target_week is not None and
                  latest_player_week >= target_week
              ):
                  raise RuntimeError(
                      "Fixed-week latest-player-row "
                      "leakage detected for "
                      f"{player_id}. Selected Week "
                      f"{latest_player_week} for target "
                      f"Week {target_week}."
                  )
                  
              player_name = (
                  latest_player_row.get(
                      "player_display_name"
                  ) or
                  latest_player_row.get(
                      "player_name"
                  )
              )

              position = latest_player_row.get(
                  "position"
              )

              team = latest_player_row.get("team")

              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              player_signal_counts[
                  "players_checked"
              ] += 1

              team_signal = (
                  current_play_caller_signals.get(
                      normalized_team
                  )
              )
              if not team_signal:
                  player_signal_counts[
                      "without_upcoming_matchup"
                  ] += 1

                  continue

              defensive_play_caller = (
                  team_signal.get(
                      "opponent_defensive_play_caller"
                  )
              )

              if not defensive_play_caller:
                  player_signal_counts[
                      "without_upcoming_matchup"
                  ] += 1

                  continue

              history_key = (
                  f"{player_id}|"
                  f"{defensive_play_caller}"
              )

              history = (
                  player_vs_defensive_caller.get(
                      history_key
                  )
              )

              signal = {
                  "player_name":
                      player_name,
                  "position":
                      position,
                  "team":
                      team,
                  "opponent":
                      team_signal.get(
                          "opponent"
                      ),
                  "defensive_play_caller":
                      defensive_play_caller,
                  "average_ppr": None,
                  "sample_size": 0,
                  "games": []
              }

              if history:
                  signal["average_ppr"] = (
                      history.get(
                          "average_ppr"
                      )
                  )

                  signal["sample_size"] = (
                      history.get(
                          "sample_size",
                          0
                      )
                  )

                  signal["games"] = (
                      history.get(
                          "games",
                          []
                      )
                  )

                  player_signal_counts[
                      "with_history"
                  ] += 1

              else:
                  player_signal_counts[
                      "without_history"
                  ] += 1

              current_player_vs_defensive_caller[
                  player_id
              ] = signal

          print(
              "Created current player-vs-defensive-"
              "play-caller signals for "
              f"{len(current_player_vs_defensive_caller)} "
              "players."
          )

          print(
              "Current players checked: "
              f"{player_signal_counts['players_checked']}."
          )

          print(
              "Players with defensive play-caller "
              "history: "
              f"{player_signal_counts['with_history']}."
          )

          print(
              "Players without defensive play-caller "
              "history: "
              f"{player_signal_counts['without_history']}."
          )

          print(
              "Players without an upcoming play-caller "
              "matchup: "
              f"{player_signal_counts['without_upcoming_matchup']}."
          )
          # -------------------------------------------------
          # NORMALIZE PLAY-CALLER SIGNALS TO 0-100
          # -------------------------------------------------

          position_values = {
              "QB": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "RB": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "WR": {
                  "play_caller": [],
                  "player_vs_caller": []
              },
              "TE": {
                  "play_caller": [],
                  "player_vs_caller": []
              }
          }

          # ---------------------------------------------
          # COLLECT PLAY-CALLER MATCHUP VALUES
          # ---------------------------------------------

          for team_signal in (
              current_play_caller_signals.values()
          ):
              for position, position_signal in (
                  team_signal.get(
                      "positions",
                      {}
                  ).items()
              ):
                  average_ppr = position_signal.get(
                      "average_ppr"
                  )

                  if (
                      position in position_values and
                      average_ppr is not None
                  ):
                      position_values[
                          position
                      ]["play_caller"].append(
                          float(average_ppr)
                      )

          # ---------------------------------------------
          # COLLECT PLAYER VS DEFENSIVE CALLER VALUES
          # ---------------------------------------------

          for signal in (
              current_player_vs_defensive_caller.values()
          ):
              position = signal.get("position")
              average_ppr = signal.get(
                  "average_ppr"
              )

              if (
                  position in position_values and
                  average_ppr is not None
              ):
                  position_values[
                      position
                  ]["player_vs_caller"].append(
                      float(average_ppr)
                  )

          # ---------------------------------------------
          # SCORE CURRENT PLAY-CALLER MATCHUPS
          # ---------------------------------------------

          for team_signal in (
              current_play_caller_signals.values()
          ):
              for position, position_signal in (
                  team_signal.get(
                      "positions",
                      {}
                  ).items()
              ):
                  average_ppr = position_signal.get(
                      "average_ppr"
                  )

                  sample_size = int(
                      position_signal.get(
                          "sample_size",
                          0
                      ) or 0
                  )

                  values = position_values.get(
                      position,
                      {}
                  ).get(
                      "play_caller",
                      []
                  )

                  if average_ppr is None:
                      raw_score = 50
                      confidence = 0.0
                      adjusted_score = 50
                      score_source = "neutral_no_history"

                  else:
                      raw_score = normalize_matchup_score(
                          average_ppr,
                          values
                      )

                      if sample_size >= 4:
                          confidence = 1.0
                      elif sample_size == 3:
                          confidence = 0.8
                      elif sample_size == 2:
                          confidence = 0.6
                      elif sample_size == 1:
                          confidence = 0.4
                      else:
                          confidence = 0.0

                      adjusted_score = round(
                          50 + (
                              raw_score - 50
                          ) * confidence,
                          2
                      )

                      score_source = (
                          "historical_sample_adjusted"
                      )

                  position_signal["raw_score"] = (
                      raw_score
                  )
                  position_signal[
                      "sample_confidence"
                  ] = confidence
                  position_signal["score"] = (
                      adjusted_score
                  )
                  position_signal[
                      "score_source"
                  ] = score_source
          # ---------------------------------------------
          # SCORE PLAYER VS DEFENSIVE CALLER
          # ---------------------------------------------

          for signal in (
              current_player_vs_defensive_caller.values()
          ):
              position = signal.get("position")
              average_ppr = signal.get(
                  "average_ppr"
              )

              sample_size = int(
                  signal.get(
                      "sample_size",
                      0
                  ) or 0
              )

              values = position_values.get(
                  position,
                  {}
              ).get(
                  "player_vs_caller",
                  []
              )

              if average_ppr is None:
                  raw_score = 50
                  confidence = 0.0
                  adjusted_score = 50
                  score_source = "neutral_no_history"

              else:
                  raw_score = normalize_matchup_score(
                      average_ppr,
                      values
                  )

                  if sample_size >= 4:
                      confidence = 1.0
                  elif sample_size == 3:
                      confidence = 0.8
                  elif sample_size == 2:
                      confidence = 0.6
                  elif sample_size == 1:
                      confidence = 0.4
                  else:
                      confidence = 0.0

                  adjusted_score = round(
                      50 + (
                          raw_score - 50
                      ) * confidence,
                      2
                  )

                  score_source = (
                      "historical_sample_adjusted"
                  )

              signal["raw_score"] = raw_score
              signal[
                  "sample_confidence"
              ] = confidence
              signal["score"] = adjusted_score
              signal[
                  "score_source"
              ] = score_source

          print(
              "Normalized play-caller signals "
              "to 0-100 scores."
          )
          # ---------------------------------------------
          # COMBINE PLAYER-LEVEL PLAY-CALLER MATCHUP
          # ---------------------------------------------

          current_player_play_caller_matchup = {}

          for player_id in current_player_ids:
              player_signal = (
                  current_player_vs_defensive_caller.get(
                      player_id
                  )
              )

              if not player_signal:
                  current_player_play_caller_matchup[
                      player_id
                  ] = {
                      "position": None,
                      "team": None,
                      "opponent": None,
                      "team_position_score": None,
                      "player_history_score": None,
                      "score": 50,
                      "available": False,
                      "score_source":
                          "neutral_no_play_caller_matchup"
                  }

                  continue

              position = player_signal.get(
                  "position"
              )
              team = player_signal.get(
                  "team"
              )

              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              team_signal = (
                  current_play_caller_signals.get(
                      normalized_team,
                      {}
                  )
              )

              position_signal = (
                  team_signal.get(
                      "positions",
                      {}
                  ).get(
                      position,
                      {}
                  )
              )

              team_position_available = (
                  position_signal.get(
                      "average_ppr"
                  ) is not None
              )

              player_history_available = (
                  player_signal.get(
                      "average_ppr"
                  ) is not None
              )

              team_position_score = (
                  position_signal.get("score")
                  if team_position_available
                  else None
              )

              player_history_score = (
                  player_signal.get("score")
                  if player_history_available
                  else None
              )

              if (
                  team_position_available and
                  player_history_available
              ):
                  combined_score = round(
                      (
                          team_position_score +
                          player_history_score
                      ) / 2,
                      2
                  )

                  available = True
                  score_source = (
                      "team_position_and_player_history"
                  )

              elif team_position_available:
                  combined_score = (
                      team_position_score
                  )
                  available = True
                  score_source = (
                      "team_position_history_only"
                  )

              elif player_history_available:
                  combined_score = (
                      player_history_score
                  )
                  available = True
                  score_source = (
                      "player_history_only"
                  )

              else:
                  combined_score = 50
                  available = False
                  score_source = (
                      "neutral_no_play_caller_history"
                  )

              current_player_play_caller_matchup[
                  player_id
              ] = {
                  "position": position,
                  "team": team,
                  "opponent":
                      player_signal.get("opponent"),
                  "offensive_play_caller":
                      team_signal.get(
                          "offensive_play_caller"
                      ),
                  "defensive_play_caller":
                      player_signal.get(
                          "defensive_play_caller"
                      ),
                  "team_position_score":
                      team_position_score,
                  "team_position_sample_size":
                      position_signal.get(
                          "sample_size",
                          0
                      ),
                  "team_position_confidence":
                      position_signal.get(
                          "sample_confidence",
                          0.0
                      ),
                  "player_history_score":
                      player_history_score,
                  "player_history_sample_size":
                      player_signal.get(
                          "sample_size",
                          0
                      ),
                  "player_history_confidence":
                      player_signal.get(
                          "sample_confidence",
                          0.0
                      ),
                  "score": combined_score,
                  "available": available,
                  "score_source": score_source
              }
          # ---------------------------------------------

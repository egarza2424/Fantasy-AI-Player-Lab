                  f"Scores: "
                  f"{len(current_player_play_caller_matchup)}, "
                  f"players: {len(current_player_ids)}."
              )

          invalid_play_caller_scores = []
          invalid_play_caller_neutral_scores = []
          invalid_play_caller_opponents = []

          play_caller_source_counts = {
              "both": 0,
              "team_only": 0,
              "player_only": 0,
              "neither": 0
          }

          for (
              player_id,
              matchup

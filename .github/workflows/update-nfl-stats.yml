                          )

              if invalid_red_zone_games:
                  raise RuntimeError(
                      "Red-zone opportunity output contains "
                      "target or future games: "
                      f"{invalid_red_zone_games[:10]}"
                  )

          red_zone_position_values = {
              "QB": [],
              "RB": [],
              "WR": [],
              "TE": []
          }

          for player_id in current_player_ids:
              red_zone = recent_player_red_zone.get(
                  player_id
              )

              if not red_zone:
                  continue

              position = red_zone.get(
                  "position"
              )

              average_red_zone_opportunity = (
                  red_zone.get(
                      "average_red_zone_opportunity"
                  )
              )

              if (
                  position in red_zone_position_values and
                  average_red_zone_opportunity is not None
              ):
                  red_zone_position_values[
                      position
                  ].append(
                      float(
                          average_red_zone_opportunity
                      )
                  )

          current_player_red_zone = {}

          for player_id in current_player_ids:
              red_zone = recent_player_red_zone.get(
                  player_id
              )

              if not red_zone:
                  current_player_red_zone[
                      player_id
                  ] = {
                      "position": None,
                      "average_red_zone_opportunity":
                          None,
                      "sample_size": 0,
                      "games": [],
                      "score": 50,
                      "score_source":
                          "neutral_no_history"
                  }

                  continue

              position = red_zone.get(
                  "position"
              )

              average_red_zone_opportunity = (
                  red_zone.get(
                      "average_red_zone_opportunity"
                  )
              )

              values = red_zone_position_values.get(
                  position,
                  []
              )

              score = normalize_matchup_score(
                  average_red_zone_opportunity,
                  values
              )

              current_player_red_zone[
                  player_id
              ] = {
                  "position": position,
                  "average_red_zone_opportunity":
                      average_red_zone_opportunity,
                  "sample_size": red_zone.get(
                      "sample_size",
                      0
                  ),
                  "games": red_zone.get(
                      "games",
                      []
                  ),
                  "score": score,
                  "score_source":
                      "red_zone_position_normalized"
              }

          print(
              "Created position-normalized red-zone "
              "opportunity scores for "
              f"{len(current_player_red_zone)} "
              "current players."
          )

          red_zone_neutral_count = sum(
              1
              for red_zone in
              current_player_red_zone.values()
              if red_zone.get("score_source") ==
              "neutral_no_history"
          )

          print(
              "Current players with neutral red-zone "
              "opportunity scores: "
              f"{red_zone_neutral_count}."
          )

          for position in {
              "QB",
              "RB",
              "WR",
              "TE"
          }:
              position_scores = [
                  red_zone.get("score")
                  for red_zone in (
                      current_player_red_zone.values()
                  )
                  if (
                      red_zone.get("position") ==
                      position and
                      red_zone.get("score") is not None
                  )
              ]

              if position_scores:
                  print(
                      f"Red-zone opportunity {position} "
                      "score range: "
                      f"{min(position_scores)}-"
                      f"{max(position_scores)} "
                      f"across {len(position_scores)} "
                      "players."
                  )

          if (
              len(current_player_red_zone) !=
              len(current_player_ids)
          ):
              raise RuntimeError(
                  "Red-zone opportunity current-player "
                  "count does not match current player pool. "
                  f"Scores: "
                  f"{len(current_player_red_zone)}, "
                  f"players: {len(current_player_ids)}."
              )

          invalid_red_zone_scores = []
          invalid_neutral_red_zone_scores = []

          for (
              player_id,
              red_zone
          ) in current_player_red_zone.items():
              score = red_zone.get("score")
              score_source = red_zone.get(
                  "score_source"
              )

              if (
                  score is None or
                  score < 0 or
                  score > 100
              ):
                  invalid_red_zone_scores.append(
                      player_id
                  )

              if (
                  score_source == "neutral_no_history" and
                  score != 50
              ):
                  invalid_neutral_red_zone_scores.append(
                      player_id
                  )

          if invalid_red_zone_scores:
              raise RuntimeError(
                  "Invalid red-zone opportunity scores for: "
                  f"{invalid_red_zone_scores[:10]}"
              )

          if invalid_neutral_red_zone_scores:
              raise RuntimeError(
                  "Neutral red-zone opportunity scores "
                  "must equal 50. Invalid players: "
                  f"{invalid_neutral_red_zone_scores[:10]}"
              )

          print(
              "Validated red-zone opportunity scores for "
              f"{len(current_player_red_zone)} "
              "current players."
          )

          def normalize_player_name(name):
              if not name:
                  return ""

              normalized_name = (
                  str(name)
                  .lower()
                  .replace(".", "")
                  .replace("'", "")
                  .replace("-", " ")
              )

              name_parts = normalized_name.split()

              suffixes = {
                  "jr",
                  "sr",
                  "ii",
                  "iii",
                  "iv",
                  "v"
              }

              while (
                  name_parts and
                  name_parts[-1] in suffixes
              ):
                  name_parts.pop()

              return " ".join(name_parts)
              
          def calculate_ecr_score(
              rank_ecr,
              model_eligible
          ):
              if not model_eligible:
                  return 50

              if rank_ecr is None:
                  return 50

              try:
                  ecr_rank = float(rank_ecr)
              except (TypeError, ValueError):
                  return 50

              if (
                  ecr_rank < 1 or
                  ecr_rank > 10
              ):
                  return 50

              if ecr_rank <= 2:
                  return 100

              if ecr_rank <= 4:
                  return 90

              if ecr_rank <= 6:
                  return 80

              if ecr_rank <= 8:
                  return 70

              if ecr_rank <= 10:
                  return 60

              return 50
              
          nflverse_player_lookup = {}

          for row in historical_rows:
              nflverse_player_id = row.get(
                  "player_id"
              )

              nflverse_player_name = (
                  row.get("player_display_name") or
                  row.get("player_name")
              )

              nflverse_position = row.get(
                  "position"
              )

              if (
                  not nflverse_player_id or
                  not nflverse_player_name or
                  nflverse_position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  }
              ):
                  continue

              normalized_nflverse_name = (
                  normalize_player_name(
                      nflverse_player_name
                  )
              )

              lookup_key = (
                  normalized_nflverse_name,
                  nflverse_position
              )

              nflverse_player_lookup[
                  lookup_key
              ] = {
                  "player_id":
                      nflverse_player_id,
                  "player_name":
                      nflverse_player_name,
                  "position":
                      nflverse_position
              }

          print(
              "Created NFLverse identity lookup for "
              f"{len(nflverse_player_lookup)} players."
          )
          # -------------------------------------------------
          # FANTASYPROS EXPERT CONSENSUS RANKINGS
          # -------------------------------------------------

          fantasypros_api_key = os.environ.get(
              "FANTASYPROS_API_KEY"
          )

          expert_rankings = {}

          fantasypros_match_count = 0
          if fantasypros_api_key:
              print("Trying FantasyPros ECR data...")

              fantasypros_positions = [
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              ]

              for fantasypros_position in fantasypros_positions:
                  fantasypros_url = (
                      "https://api.fantasypros.com/"
                      "public/v2/json/nfl/2026/"
                      "consensus-rankings"
                      f"?position={fantasypros_position}"
                      "&scoring=PPR"
                  )

                  print(
                      "Trying FantasyPros "
                      f"{fantasypros_position} ECR..."
                  )

                  request = urllib.request.Request(
                      fantasypros_url,
                      headers={
                          "x-api-key": fantasypros_api_key,
                          "User-Agent": "FantasyAIPlayerLab/1.0"
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request
                      ) as response:
                          fp_data = json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )
                      print(
                          "FantasyPros access info: "
                          f"limit={fp_data.get('limit')}, "
                          "public_api_limited="
                          f"{fp_data.get('public_api_limited')}, "
                          f"tier={fp_data.get('tier')}"
                      )
                      fp_players = fp_data.get(
                          "players",
                          []
                      )

                      fp_reported_count = fp_data.get(
                          "count"
                      )

                      fp_total_experts = fp_data.get(
                          "total_experts"
                      )

                      print(
                          "FantasyPros "
                          f"{fantasypros_position} returned "
                          f"{len(fp_players)} players. "
                          "API reported count: "
                          f"{fp_reported_count}. "
                          "Total experts: "
                          f"{fp_total_experts}."
                      )

                      for player in fp_players:
                          name = player.get(
                              "player_name"
                          )

                          if not name:
                              continue

                          position = player.get(
                              "player_position_id"
                          )

                          if position not in {
                              "QB",
                              "RB",
                              "WR",
                              "TE"
                          }:
                              continue
                          normalized_fp_name = (
                              normalize_player_name(
                                  name
                              )
                          )

                          nflverse_match = (
                              nflverse_player_lookup.get(
                                  (
                                      normalized_fp_name,
                                      position
                                  )
                              )
                          )

                          nflverse_player_id = None
                          nflverse_player_name = None

                          if nflverse_match:
                              nflverse_player_id = (
                                  nflverse_match.get(
                                      "player_id"
                                  )
                              )

                              nflverse_player_name = (
                                  nflverse_match.get(
                                      "player_name"
                                  )
                              )
                              
                              fantasypros_match_count += 1
                          expert_rankings[name] = {
                              "fantasypros_player_id":
                                  player.get(
                                      "player_id"
                                  ),
                              "nflverse_player_id":
                                  nflverse_player_id,
                              "nflverse_player_name":
                                  nflverse_player_name,
                              "team":
                                  player.get(
                                      "player_team_id"
                                  ),
                              "position":
                                  position,
                              "rank_ecr":
                                  player.get(
                                      "rank_ecr"
                                  ),
                              "rank_min":
                                  player.get(
                                      "rank_min"
                                  ),
                              "rank_max":
                                  player.get(
                                      "rank_max"
                                  ),
                              "rank_ave":
                                  player.get(
                                      "rank_ave"
                                  ),
                              "rank_std":
                                  player.get(
                                      "rank_std"
                                  ),
                              "pos_rank":
                                  player.get(
                                      "pos_rank"
                                  )
                          }

                  except Exception as error:
                      print(
                          "FantasyPros "
                          f"{fantasypros_position} "
                          "ECR unavailable: "
                          f"{error}"
                      )
          else:
              print(
                  "FANTASYPROS_API_KEY secret "
                  "not available."
              )

          print(
              f"Created expert ranking data "
              f"for {len(expert_rankings)} players."
          )
          print(
              "FantasyPros/NFLverse identity matches: "
              f"{fantasypros_match_count} of "
              f"{len(expert_rankings)}."
          )
          if target_week is None:
              expert_rankings_mode = "live"
              expert_rankings_model_eligible = True
          else:
              expert_rankings_mode = "current_ecr_on_historical_snapshot"
              expert_rankings_model_eligible = False

          print(
              "FantasyPros ECR mode: "
              f"{expert_rankings_mode}. "
              "Model eligible: "
              f"{expert_rankings_model_eligible}."
          )

          for expert_ranking in expert_rankings.values():
              expert_ranking[
                  "model_eligible"
              ] = expert_rankings_model_eligible

              rank_ecr = expert_ranking.get(
                  "rank_ecr"
              )

              try:
                  numeric_rank_ecr = float(
                      rank_ecr
                  )
              except (TypeError, ValueError):
                  numeric_rank_ecr = None

              expert_ranking[
                  "ecr_available"
              ] = (
                  expert_rankings_model_eligible and
                  numeric_rank_ecr is not None and
                  1 <= numeric_rank_ecr <= 10
              )

              expert_ranking[
                  "ecr_score"
              ] = calculate_ecr_score(
                  expert_ranking.get("rank_ecr"),
                  expert_rankings_model_eligible
              )

          invalid_available_ecr = []

          for (
              expert_name,
              expert_ranking
          ) in expert_rankings.items():
              if not expert_ranking.get(
                  "ecr_available"
              ):
                  continue

              try:
                  available_rank_ecr = float(
                      expert_ranking.get("rank_ecr")
                  )
              except (TypeError, ValueError):
                  available_rank_ecr = None

              if (
                  available_rank_ecr is None or
                  available_rank_ecr < 1 or
                  available_rank_ecr > 10 or
                  not expert_ranking.get(
                      "model_eligible"
                  )
              ):
                  invalid_available_ecr.append(
                      expert_name
                  )

          if invalid_available_ecr:
              raise RuntimeError(
                  "Invalid usable ECR state for: "
                  f"{invalid_available_ecr}"
              )              
          invalid_unavailable_ecr_scores = [
              expert_name
              for expert_name, expert_ranking
              in expert_rankings.items()
              if (
                  not expert_ranking.get(
                      "ecr_available"
                  ) and
                  expert_ranking.get(
                      "ecr_score"
                  ) != 50
              )
          ]

          if invalid_unavailable_ecr_scores:
              raise RuntimeError(
                  "Unavailable ECR has a non-neutral "
                  "score for: "
                  f"{invalid_unavailable_ecr_scores}"
              )          
          available_ecr_signals = sum(
              1
              for expert_ranking in expert_rankings.values()
              if expert_ranking.get("ecr_available")
          )

          unavailable_ecr_signals = (
              len(expert_rankings) -
              available_ecr_signals
          )

          print(
              "ECR availability: "
              f"{available_ecr_signals} usable, "
              f"{unavailable_ecr_signals} unavailable."
          )

          active_ecr_scores = sum(
              1
              for expert_ranking in expert_rankings.values()
              if (
                  expert_ranking.get("ecr_available") and
                  expert_ranking.get("ecr_score") != 50
              )
          )

          print(
              "ECR scoring signals: "
              f"{active_ecr_scores} active."
          )
          if (
              len(current_recent_performance) !=
              len(current_player_ids)
          ):
              raise RuntimeError(
                  "Recent-performance current-player "
                  "count does not match current player pool. "
                  f"Scores: "
                  f"{len(current_recent_performance)}, "
                  f"players: {len(current_player_ids)}."
              )

          invalid_recent_performance_scores = []

          for (
              player_id,
              performance
          ) in current_recent_performance.items():
              score = performance.get("score")

              if (
                  score is None or
                  score < 0 or
                  score > 100
              ):
                  invalid_recent_performance_scores.append(
                      player_id
                  )

          if invalid_recent_performance_scores:
              raise RuntimeError(
                  "Invalid recent-performance scores for: "
                  f"{invalid_recent_performance_scores[:10]}"
              )

          print(
              "Validated recent-performance scores for "
              f"{len(current_recent_performance)} "
              "current players."
          )
          output = {
              "season": season_used,
              "target_week": target_week,
              "schedule_mode": (
                  "fixed_week"
                  if target_week is not None
                  else "next_opponent"
              ),
              "updated": datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%d"),
              "source": "nflverse",
              "expert_rankings_mode":
                  expert_rankings_mode,
              "expert_rankings_model_eligible":
                  expert_rankings_model_eligible,

              "players": rolling_model_rows,
              "recent_player_performance":
                  current_recent_performance,
              "opportunity_volume":
                  current_player_opportunity,
              "red_zone_opportunity":
                  current_player_red_zone,
              "defensive_matchup":
                  current_player_defensive_matchup,
              "defense_position_allowed":
                  defense_position_allowed,
              "team_next_opponent":
                  team_next_opponent,
              "current_play_caller_signals":
                  current_play_caller_signals,
              "play_caller_matchup":
                  current_player_play_caller_matchup,
              "current_player_vs_defensive_caller":
                  current_player_vs_defensive_caller,
              "play_caller_matchups":
                  play_caller_matchups,
              "player_vs_defensive_caller":
                  player_vs_defensive_caller,
              "expert_rankings":
                  expert_rankings
          }
          if target_week is not None:
              output_filename = (
                  f"nfl-stats-week{target_week}-snapshot.json"
              )
          else:
              output_filename = "nfl-stats.json"

          with open(
              output_filename,
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2
              )

          print(
              f"Created {output_filename} with "
              f"{len(rows)} records "
              f"from the {season_used} season."
          )
          PY
          
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$TARGET_WEEK" ]; then
            OUTPUT_FILE="nfl-stats-week${TARGET_WEEK}-snapshot.json"
          else
            OUTPUT_FILE="nfl-stats.json"
          fi

          git add "$OUTPUT_FILE"

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update NFL player stats"
            git push
          fi

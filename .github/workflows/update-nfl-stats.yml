name: Update NFL Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and convert NFL stats
        run: |
          python <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          seasons = [2025]

          selected_fields = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "position_group",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds"
          ]

          rows = []
          season_used = None

          for season in seasons:
              stats_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  f"releases/download/stats_player/stats_player_week_{season}.csv"
              )

              print(f"Trying player stats: {stats_url}")

              try:
                  with urllib.request.urlopen(stats_url) as response:
                      content = response.read().decode("utf-8")

                  reader = csv.DictReader(io.StringIO(content))

                  season_rows = []

                  for row in reader:
                      if row.get("position") not in {"QB", "RB", "WR", "TE"}:
                          continue

                      if row.get("season_type") not in {"REG", ""}:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      clean_row["red_zone_pass_attempts"] = 0
                      clean_row["red_zone_carries"] = 0
                      clean_row["red_zone_targets"] = 0

                      season_rows.append(clean_row)

                  if season_rows:
                      rows = season_rows
                      season_used = season

                      print(
                          f"Loaded {len(rows)} player-week records "
                          f"for {season}"
                      )

                      break

              except Exception as error:
                  print(f"{season} player stats unavailable: {error}")

          if not rows:
              raise RuntimeError(
                  "No NFL player stats could be downloaded."
              )

          pbp_url = (
              "https://github.com/nflverse/nflverse-data/"
              f"releases/download/pbp/play_by_play_{season_used}.csv.gz"
          )

          print(f"Trying play-by-play: {pbp_url}")

          red_zone_stats = defaultdict(
              lambda: {
                  "red_zone_pass_attempts": 0,
                  "red_zone_carries": 0,
                  "red_zone_targets": 0
              }
          )

          with urllib.request.urlopen(pbp_url) as response:
              compressed = response.read()

          content = gzip.decompress(compressed).decode("utf-8")

          reader = csv.DictReader(io.StringIO(content))

          for play in reader:
              if play.get("season_type") != "REG":
                  continue

              try:
                  yardline = float(play.get("yardline_100") or 999)
              except ValueError:
                  continue

              if yardline > 20:
                  continue

              week = play.get("week")
              team = play.get("posteam")

              if not week or not team:
                  continue

              passer_id = play.get("passer_player_id")
              rusher_id = play.get("rusher_player_id")
              receiver_id = play.get("receiver_player_id")

              pass_attempt = play.get("pass_attempt") == "1"
              rush_attempt = play.get("rush_attempt") == "1"

              if pass_attempt and passer_id:
                  key = (passer_id, str(week))

                  red_zone_stats[key][
                      "red_zone_pass_attempts"
                  ] += 1

              if rush_attempt and rusher_id:
                  key = (rusher_id, str(week))

                  red_zone_stats[key][
                      "red_zone_carries"
                  ] += 1

              if pass_attempt and receiver_id:
                  key = (receiver_id, str(week))

                  red_zone_stats[key][
                      "red_zone_targets"
                  ] += 1

          matched = 0

          for row in rows:
              player_id = row.get("player_id")
              week = str(row.get("week"))

              key = (player_id, week)

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)
                  matched += 1

          print(
              f"Matched red-zone stats to "
              f"{matched} player-week rows."
          )
          # -------------------------------------------------
          # MATCHUP DATA
          # Calculate 2025 fantasy points allowed per game
          # by each defense to QB, RB, WR and TE.
          # -------------------------------------------------

          defense_position_totals = defaultdict(
              lambda: {
                  "fantasy_points": 0.0,
                  "games": set()
              }
          )

          for row in rows:
              defense = row.get("opponent_team")
              position = row.get("position")
              week = str(row.get("week") or "")

              if (
                  not defense or
                  position not in {"QB", "RB", "WR", "TE"} or
                  not week
              ):
                  continue

              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              fantasy_points = (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )

              key = (defense, position)

              defense_position_totals[key][
                  "fantasy_points"
              ] += fantasy_points

              defense_position_totals[key][
                  "games"
              ].add(week)

          defense_position_allowed = {}

          for (defense, position), data in (
              defense_position_totals.items()
          ):
              game_count = len(data["games"])

              if game_count == 0:
                  continue

              if defense not in defense_position_allowed:
                  defense_position_allowed[defense] = {}

              defense_position_allowed[defense][position] = round(
                  data["fantasy_points"] / game_count,
                  2
              )

          print(
              f"Created defensive matchup data for "
              f"{len(defense_position_allowed)} teams."
          )
          # -------------------------------------------------
          # 2026 CURRENT / NEXT OPPONENT DATA
          # -------------------------------------------------

          schedule_url = (
              "https://raw.githubusercontent.com/"
              "nflverse/nfldata/master/data/games.csv"
          )

          print(f"Trying schedule data: {schedule_url}")

          with urllib.request.urlopen(schedule_url) as response:
              schedule_content = (
                  response.read().decode("utf-8")
              )

          schedule_reader = csv.DictReader(
              io.StringIO(schedule_content)
          )

          today = datetime.now(timezone.utc).date()

          upcoming_games = []

          for game in schedule_reader:
              if str(game.get("season")) != "2026":
                  continue

              if game.get("game_type") not in {"REG", ""}:
                  continue

              gameday = game.get("gameday")

              if not gameday:
                  continue

              try:
                  game_date = datetime.strptime(
                      gameday,
                      "%Y-%m-%d"
                  ).date()
              except ValueError:
                  continue

              if game_date < today:
                  continue

              away_team = game.get("away_team")
              home_team = game.get("home_team")

              if not away_team or not home_team:
                  continue

              upcoming_games.append({
                  "date": game_date,
                  "week": int(game.get("week") or 0),
                  "away_team": away_team,
                  "home_team": home_team
              })

          upcoming_games.sort(
              key=lambda game: (
                  game["date"],
                  game["week"]
              )
          )

          team_next_opponent = {}

          for game in upcoming_games:
              away_team = game["away_team"]
              home_team = game["home_team"]

              if away_team not in team_next_opponent:
                  team_next_opponent[away_team] = {
                      "opponent": home_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "away"
                  }

              if home_team not in team_next_opponent:
                  team_next_opponent[home_team] = {
                      "opponent": away_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "home"
                  }

          print(
              f"Created next-opponent data for "
              f"{len(team_next_opponent)} teams."
          )
          # -------------------------------------------------
          # FANTASYPROS EXPERT CONSENSUS RANKINGS
          # -------------------------------------------------

          fantasypros_api_key = os.environ.get(
              "FANTASYPROS_API_KEY"
          )

          expert_rankings = {}

          if fantasypros_api_key:
              print("Trying FantasyPros ECR data...")

              positions = ["QB", "RB", "WR", "TE"]

              for position in positions:
                  fp_url = (
                      "https://api.fantasypros.com/"
                      "public/v2/json/nfl/2026/"
                      "consensus-rankings"
                      f"?position={position}"
                      "&scoring=PPR"
                  )

                  request = urllib.request.Request(
                      fp_url,
                      headers={
                          "x-api-key":
                              fantasypros_api_key
                      }
                  )

                  try:
                      with urllib.request.urlopen(
                          request
                      ) as response:
                          fp_data = json.loads(
                              response.read().decode(
                                  "utf-8"
                              )
                          )

                      for player in fp_data.get(
                          "players",
                          []
                      ):
                          name = player.get(
                              "player_name"
                          )

                          if not name:
                              continue

                          expert_rankings[name] = {
                              "player_id":
                                  player.get(
                                      "player_id"
                                  ),
                              "team":
                                  player.get(
                                      "player_team_id"
                                  ),
                              "position":
                                  player.get(
                                      "player_position_id"
                                  ),
                              "rank_ecr":
                                  player.get(
                                      "rank_ecr"
                                  ),
                              "rank_min":
                                  player.get(
                                      "rank_min"
                                  ),
                              "rank_max":
                                  player.get(
                                      "rank_max"
                                  ),
                              "rank_ave":
                                  player.get(
                                      "rank_ave"
                                  ),
                              "rank_std":
                                  player.get(
                                      "rank_std"
                                  ),
                              "pos_rank":
                                  player.get(
                                      "pos_rank"
                                  )
                          }

                      print(
                          f"Loaded FantasyPros "
                          f"{position} ECR data."
                      )

                  except Exception as error:
                      print(
                          f"FantasyPros {position} "
                          f"ECR unavailable: {error}"
                      )

          else:
              print(
                  "FANTASYPROS_API_KEY secret "
                  "not available."
              )

          print(
              f"Created expert ranking data "
              f"for {len(expert_rankings)} players."
          )
          output = {
              "season": season_used,
              "updated": datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%d"),
              "source": "nflverse",
              "players": rows,
              "defense_position_allowed":
                  defense_position_allowed,
              "team_next_opponent":
                  team_next_opponent,
              "expert_rankings":
                  expert_rankings
          }
          with open(
              "nfl-stats.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2
              )

          print(
              f"Created nfl-stats.json with "
              f"{len(rows)} records "
              f"from the {season_used} season."
          )
          PY
          
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nfl-stats.json

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update NFL player stats"
            git push
          fi

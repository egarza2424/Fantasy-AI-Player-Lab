name: Update NFL Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write
jobs:
  update-stats:
    runs-on: ubuntu-latest
    env:
      FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download and convert NFL stats
        run: |
          python <<'PY'
          import csv
          import gzip
          import io
          import json
          import os
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          seasons = [2025]
          # -------------------------------------------------
          # COACHING / PLAY-CALLER DATA
          # -------------------------------------------------

          with open(
              "coordinators.json",
              "r",
              encoding="utf-8"
          ) as file:
              coaching_data = json.load(file)

          expected_seasons = {
              "2022",
              "2023",
              "2024",
              "2025",
              "2026"
          }

          missing_seasons = (
              expected_seasons -
              set(coaching_data.keys())
          )

          if missing_seasons:
              raise RuntimeError(
                  "Missing coaching seasons: "
                  f"{sorted(missing_seasons)}"
              )

          expected_teams = 32

          for season in sorted(expected_seasons):
              team_count = len(
                  coaching_data.get(season, {})
              )

              if team_count != expected_teams:
                  raise RuntimeError(
                      f"{season} coaching data has "
                      f"{team_count} teams instead of 32."
                  )

          print(
              "Loaded coaching/play-caller data "
              f"for {len(coaching_data)} seasons."
          )
          selected_fields = [
              "player_id",
              "player_name",
              "player_display_name",
              "position",
              "position_group",
              "season",
              "week",
              "season_type",
              "team",
              "opponent_team",
              "attempts",
              "passing_yards",
              "passing_tds",
              "interceptions",
              "carries",
              "rushing_yards",
              "rushing_tds",
              "targets",
              "receptions",
              "receiving_yards",
              "receiving_tds"
          ]

          rows = []
          season_used = None

          for season in seasons:
              stats_url = (
                  "https://github.com/nflverse/nflverse-data/"
                  f"releases/download/stats_player/stats_player_week_{season}.csv"
              )

              print(f"Trying player stats: {stats_url}")

              try:
                  with urllib.request.urlopen(stats_url) as response:
                      content = response.read().decode("utf-8")

                  reader = csv.DictReader(io.StringIO(content))

                  season_rows = []

                  for row in reader:
                      if row.get("position") not in {"QB", "RB", "WR", "TE"}:
                          continue

                      if row.get("season_type") not in {"REG", ""}:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      clean_row["red_zone_pass_attempts"] = 0
                      clean_row["red_zone_carries"] = 0
                      clean_row["red_zone_targets"] = 0

                      season_rows.append(clean_row)

                  if season_rows:
                      rows = season_rows
                      season_used = season

                      print(
                          f"Loaded {len(rows)} player-week records "
                          f"for {season}"
                      )

                      break

              except Exception as error:
                  print(f"{season} player stats unavailable: {error}")

          if not rows:
              raise RuntimeError(
                  "No NFL player stats could be downloaded."
              )
          # -------------------------------------------------
          # HISTORICAL PLAYER-WEEK DATA
          # 2022-2025 for coaching matchup calculations
          # -------------------------------------------------

          historical_rows = []

          historical_seasons = [
              2022,
              2023,
              2024
          ]

          for historical_season in historical_seasons:
              historical_url = (
                  "https://github.com/nflverse/"
                  "nflverse-data/releases/download/"
                  "stats_player/"
                  f"stats_player_week_{historical_season}.csv"
              )

              print(
                  "Trying historical player stats: "
                  f"{historical_url}"
              )

              try:
                  with urllib.request.urlopen(
                      historical_url
                  ) as response:
                      historical_content = (
                          response.read().decode("utf-8")
                      )

                  historical_reader = csv.DictReader(
                      io.StringIO(historical_content)
                  )

                  season_record_count = 0

                  for row in historical_reader:
                      if row.get("position") not in {
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      }:
                          continue

                      if row.get("season_type") not in {
                          "REG",
                          ""
                      }:
                          continue

                      clean_row = {
                          field: row.get(field, "")
                          for field in selected_fields
                      }

                      historical_rows.append(
                          clean_row
                      )

                      season_record_count += 1

                  print(
                      f"Loaded {season_record_count} "
                      "historical player-week records "
                      f"for {historical_season}."
                  )

              except Exception as error:
                  raise RuntimeError(
                      "Historical player stats unavailable "
                      f"for {historical_season}: {error}"
                  )

          # 2025 is already loaded above as the current
          # player-week dataset, so reuse it instead of
          # downloading the same file a second time.
          historical_rows.extend(
              dict(row)
              for row in rows
          )

          print(
              "Loaded "
              f"{len(historical_rows)} total historical "
              "player-week records for 2022-2025."
          )
          # -------------------------------------------------
          # ATTACH HISTORICAL COACHING / PLAY-CALLER DATA
          # -------------------------------------------------

          coaching_records_matched = 0
          coaching_records_missing = 0

          for row in historical_rows:
              season = str(row.get("season") or "")
              offense_team = row.get("team")
              defense_team = row.get("opponent_team")
              if offense_team == "LA":
                  offense_team = "LAR"

              if defense_team == "LA":
                  defense_team = "LAR"

              season_coaches = coaching_data.get(
                  season,
                  {}
              )

              offense_coaches = season_coaches.get(
                  offense_team,
                  {}
              )

              defense_coaches = season_coaches.get(
                  defense_team,
                  {}
              )

              row["offensive_coordinator"] = (
                  offense_coaches.get(
                      "offensive_coordinator"
                  )
              )

              row["offensive_play_caller"] = (
                  offense_coaches.get(
                      "offensive_play_caller"
                  )
              )

              row["defensive_coordinator"] = (
                  defense_coaches.get(
                      "defensive_coordinator"
                  )
              )

              row["defensive_play_caller"] = (
                  defense_coaches.get(
                      "defensive_play_caller"
                  )
              )

              if (
                  row["offensive_play_caller"] and
                  row["defensive_play_caller"]
              ):
                  coaching_records_matched += 1
              else:
                  coaching_records_missing += 1

          print(
              "Attached coaching data to "
              f"{coaching_records_matched} "
              "historical player-week records."
          )

          print(
              "Historical records missing a play caller: "
              f"{coaching_records_missing}."
          )
          # -------------------------------------------------
          # DIAGNOSE MISSING COACHING MAPPINGS
          # -------------------------------------------------

          missing_mapping_counts = defaultdict(int)

          for row in historical_rows:
              if (
                  row.get("offensive_play_caller") and
                  row.get("defensive_play_caller")
              ):
                  continue

              season = str(row.get("season") or "")
              offense_team = row.get("team") or "UNKNOWN"
              defense_team = (
                  row.get("opponent_team") or "UNKNOWN"
              )

              if not row.get("offensive_play_caller"):
                  key = (
                      season,
                      "OFFENSE",
                      offense_team
                  )

                  missing_mapping_counts[key] += 1

              if not row.get("defensive_play_caller"):
                  key = (
                      season,
                      "DEFENSE",
                      defense_team
                  )

                  missing_mapping_counts[key] += 1

          print(
              "Missing coaching mappings by "
              "season/team:"
          )

          for (
              season,
              side,
              team
          ), count in sorted(
              missing_mapping_counts.items()
          ):
              print(
                  f"{season} {side} {team}: "
                  f"{count}"
              )
          # -------------------------------------------------
          # HISTORICAL PLAY-CALLER MATCHUP PPR
          # -------------------------------------------------

          play_caller_game_totals = defaultdict(float)

          for row in historical_rows:
              offensive_play_caller = row.get(
                  "offensive_play_caller"
              )

              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )

              position = row.get("position")
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not offensive_play_caller or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              fantasy_points = (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )

              game_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position,
                  season,
                  week
              )

              play_caller_game_totals[
                  game_key
              ] += fantasy_points

          play_caller_matchup_history = defaultdict(
              list
          )

          for (
              offensive_play_caller,
              defensive_play_caller,
              position,
              season,
              week
          ), fantasy_points in (
              play_caller_game_totals.items()
          ):
              matchup_key = (
                  offensive_play_caller,
                  defensive_play_caller,
                  position
              )

              play_caller_matchup_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  )
              })

          for matchup_games in (
              play_caller_matchup_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          play_caller_matchups = {}

          for matchup_key, matchup_games in (
              play_caller_matchup_history.items()
          ):
              recent_games = matchup_games[:4]

              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              key_string = "|".join(
                  matchup_key
              )

              play_caller_matchups[
                  key_string
              ] = {
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": recent_games
              }

          print(
              "Created "
              f"{len(play_caller_matchups)} "
              "historical play-caller matchup "
              "profiles."
          )
          # -------------------------------------------------
          # PLAYER VS DEFENSIVE PLAY-CALLER PPR
          # -------------------------------------------------

          player_vs_defensive_caller_history = defaultdict(
              list
          )

          for row in historical_rows:
              player_id = row.get("player_id")
              player_name = (
                  row.get("player_display_name") or
                  row.get("player_name")
              )
              position = row.get("position")
              defensive_play_caller = row.get(
                  "defensive_play_caller"
              )
              season = str(row.get("season") or "")
              week = str(row.get("week") or "")

              if (
                  not player_id or
                  not defensive_play_caller or
                  position not in {
                      "QB",
                      "RB",
                      "WR",
                      "TE"
                  } or
                  not season or
                  not week
              ):
                  continue

              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              fantasy_points = (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )

              matchup_key = (
                  player_id,
                  defensive_play_caller
              )

              player_vs_defensive_caller_history[
                  matchup_key
              ].append({
                  "season": int(season),
                  "week": int(float(week)),
                  "ppr_points": round(
                      fantasy_points,
                      2
                  ),
                  "player_name": player_name,
                  "position": position
              })

          for matchup_games in (
              player_vs_defensive_caller_history.values()
          ):
              matchup_games.sort(
                  key=lambda game: (
                      game["season"],
                      game["week"]
                  ),
                  reverse=True
              )

          player_vs_defensive_caller = {}

          for matchup_key, matchup_games in (
              player_vs_defensive_caller_history.items()
          ):
              recent_games = matchup_games[:4]

              average_ppr = sum(
                  game["ppr_points"]
                  for game in recent_games
              ) / len(recent_games)

              player_id, defensive_play_caller = (
                  matchup_key
              )

              key_string = (
                  f"{player_id}|"
                  f"{defensive_play_caller}"
              )

              player_vs_defensive_caller[
                  key_string
              ] = {
                  "player_name":
                      recent_games[0][
                          "player_name"
                      ],
                  "position":
                      recent_games[0][
                          "position"
                      ],
                  "defensive_play_caller":
                      defensive_play_caller,
                  "average_ppr": round(
                      average_ppr,
                      2
                  ),
                  "sample_size": len(
                      recent_games
                  ),
                  "games": [
                      {
                          "season":
                              game["season"],
                          "week":
                              game["week"],
                          "ppr_points":
                              game["ppr_points"]
                      }
                      for game in recent_games
                  ]
              }

          print(
              "Created "
              f"{len(player_vs_defensive_caller)} "
              "player-vs-defensive-play-caller "
              "profiles."
          )
          pbp_url = (
              "https://github.com/nflverse/nflverse-data/"
              f"releases/download/pbp/play_by_play_{season_used}.csv.gz"
          )

          print(f"Trying play-by-play: {pbp_url}")

          red_zone_stats = defaultdict(
              lambda: {
                  "red_zone_pass_attempts": 0,
                  "red_zone_carries": 0,
                  "red_zone_targets": 0
              }
          )

          with urllib.request.urlopen(pbp_url) as response:
              compressed = response.read()

          content = gzip.decompress(compressed).decode("utf-8")

          reader = csv.DictReader(io.StringIO(content))

          for play in reader:
              if play.get("season_type") != "REG":
                  continue

              try:
                  yardline = float(play.get("yardline_100") or 999)
              except ValueError:
                  continue

              if yardline > 20:
                  continue

              week = play.get("week")
              team = play.get("posteam")

              if not week or not team:
                  continue

              passer_id = play.get("passer_player_id")
              rusher_id = play.get("rusher_player_id")
              receiver_id = play.get("receiver_player_id")

              pass_attempt = play.get("pass_attempt") == "1"
              rush_attempt = play.get("rush_attempt") == "1"

              if pass_attempt and passer_id:
                  key = (passer_id, str(week))

                  red_zone_stats[key][
                      "red_zone_pass_attempts"
                  ] += 1

              if rush_attempt and rusher_id:
                  key = (rusher_id, str(week))

                  red_zone_stats[key][
                      "red_zone_carries"
                  ] += 1

              if pass_attempt and receiver_id:
                  key = (receiver_id, str(week))

                  red_zone_stats[key][
                      "red_zone_targets"
                  ] += 1

          matched = 0

          for row in rows:
              player_id = row.get("player_id")
              week = str(row.get("week"))

              key = (player_id, week)

              rz = red_zone_stats.get(key)

              if rz:
                  row.update(rz)
                  matched += 1

          print(
              f"Matched red-zone stats to "
              f"{matched} player-week rows."
          )
          # -------------------------------------------------
          # MATCHUP DATA
          # Calculate 2025 fantasy points allowed per game
          # by each defense to QB, RB, WR and TE.
          # -------------------------------------------------

          defense_position_totals = defaultdict(
              lambda: {
                  "fantasy_points": 0.0,
                  "games": set()
              }
          )

          for row in rows:
              defense = row.get("opponent_team")
              position = row.get("position")
              week = str(row.get("week") or "")

              if (
                  not defense or
                  position not in {"QB", "RB", "WR", "TE"} or
                  not week
              ):
                  continue

              passing_yards = float(
                  row.get("passing_yards") or 0
              )

              passing_tds = float(
                  row.get("passing_tds") or 0
              )

              interceptions = float(
                  row.get("interceptions") or 0
              )

              rushing_yards = float(
                  row.get("rushing_yards") or 0
              )

              rushing_tds = float(
                  row.get("rushing_tds") or 0
              )

              receptions = float(
                  row.get("receptions") or 0
              )

              receiving_yards = float(
                  row.get("receiving_yards") or 0
              )

              receiving_tds = float(
                  row.get("receiving_tds") or 0
              )

              fantasy_points = (
                  passing_yards / 25 +
                  passing_tds * 4 -
                  interceptions * 2 +
                  rushing_yards / 10 +
                  rushing_tds * 6 +
                  receptions +
                  receiving_yards / 10 +
                  receiving_tds * 6
              )

              key = (defense, position)

              defense_position_totals[key][
                  "fantasy_points"
              ] += fantasy_points

              defense_position_totals[key][
                  "games"
              ].add(week)

          defense_position_allowed = {}

          for (defense, position), data in (
              defense_position_totals.items()
          ):
              game_count = len(data["games"])

              if game_count == 0:
                  continue

              if defense not in defense_position_allowed:
                  defense_position_allowed[defense] = {}

              defense_position_allowed[defense][position] = round(
                  data["fantasy_points"] / game_count,
                  2
              )

          print(
              f"Created defensive matchup data for "
              f"{len(defense_position_allowed)} teams."
          )
          # -------------------------------------------------
          # 2026 CURRENT / NEXT OPPONENT DATA
          # -------------------------------------------------

          schedule_url = (
              "https://raw.githubusercontent.com/"
              "nflverse/nfldata/master/data/games.csv"
          )

          print(f"Trying schedule data: {schedule_url}")

          with urllib.request.urlopen(schedule_url) as response:
              schedule_content = (
                  response.read().decode("utf-8")
              )

          schedule_reader = csv.DictReader(
              io.StringIO(schedule_content)
          )

          today = datetime.now(timezone.utc).date()

          upcoming_games = []

          for game in schedule_reader:
              if str(game.get("season")) != "2026":
                  continue

              if game.get("game_type") not in {"REG", ""}:
                  continue

              gameday = game.get("gameday")

              if not gameday:
                  continue

              try:
                  game_date = datetime.strptime(
                      gameday,
                      "%Y-%m-%d"
                  ).date()
              except ValueError:
                  continue

              if game_date < today:
                  continue

              away_team = game.get("away_team")
              home_team = game.get("home_team")

              if not away_team or not home_team:
                  continue

              upcoming_games.append({
                  "date": game_date,
                  "week": int(game.get("week") or 0),
                  "away_team": away_team,
                  "home_team": home_team
              })

          upcoming_games.sort(
              key=lambda game: (
                  game["date"],
                  game["week"]
              )
          )

          team_next_opponent = {}

          for game in upcoming_games:
              away_team = game["away_team"]
              home_team = game["home_team"]

              if away_team not in team_next_opponent:
                  team_next_opponent[away_team] = {
                      "opponent": home_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "away"
                  }

              if home_team not in team_next_opponent:
                  team_next_opponent[home_team] = {
                      "opponent": away_team,
                      "week": game["week"],
                      "gameday": game["date"].isoformat(),
                      "location": "home"
                  }

          print(
              f"Created next-opponent data for "
              f"{len(team_next_opponent)} teams."
          )
          # -------------------------------------------------
          # 2026 PLAY-CALLER MATCHUP SIGNALS
          # -------------------------------------------------

          current_coaching = coaching_data.get(
              "2026",
              {}
          )

          current_play_caller_signals = {}

          signal_counts = {
              "teams_with_matchup": 0,
              "play_caller_history": 0,
              "play_caller_no_history": 0
          }

          for team, matchup in (
              team_next_opponent.items()
          ):
              normalized_team = (
                  "LAR"
                  if team == "LA"
                  else team
              )

              opponent = matchup.get(
                  "opponent"
              )

              normalized_opponent = (
                  "LAR"
                  if opponent == "LA"
                  else opponent
              )

              offense_staff = (
                  current_coaching.get(
                      normalized_team,
                      {}
                  )
              )

              defense_staff = (
                  current_coaching.get(
                      normalized_opponent,
                      {}
                  )
              )

              offensive_play_caller = (
                  offense_staff.get(
                      "offensive_play_caller"
                  )
              )

              defensive_play_caller = (
                  defense_staff.get(
                      "defensive_play_caller"
                  )
              )

              team_signal = {
                  "opponent":
                      normalized_opponent,
                  "week":
                      matchup.get("week"),
                  "offensive_coordinator":
                      offense_staff.get(
                          "offensive_coordinator"
                      ),
                  "offensive_play_caller":
                      offensive_play_caller,
                  "opponent_defensive_coordinator":
                      defense_staff.get(
                          "defensive_coordinator"
                      ),
                  "opponent_defensive_play_caller":
                      defensive_play_caller,
                  "positions": {}
              }

              if (
                  offensive_play_caller and
                  defensive_play_caller
              ):
                  signal_counts[
                      "teams_with_matchup"
                  ] += 1

              for position in {
                  "QB",
                  "RB",
                  "WR",
                  "TE"
              }:
                  history_key = "|".join([
                      offensive_play_caller or "",
                      defensive_play_caller or "",
                      position
                  ])

                  history = (
                      play_caller_matchups.get(
                          history_key
                      )
                  )

                  if history:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr":
                              history.get(
                                  "average_ppr"
                              ),
                          "sample_size":
                              history.get(
                                  "sample_size"
                              ),
                          "games":
                              history.get(
                                  "games",
                                  []
                              )
                      }

                      signal_counts[
                          "play_caller_history"
                      ] += 1

                  else:
                      team_signal[
                          "positions"
                      ][position] = {
                          "average_ppr": None,
                          "sample_size": 0,
                          "games": []
                      }

                      signal_counts[
                          "play_caller_no_history"
                      ] += 1

              current_play_caller_signals[
                  normalized_team
              ] = team_signal

          print(
              "Created current play-caller signals "
              f"for {len(current_play_caller_signals)} "
              "teams."
          )

          print(
              "2026 teams with both play callers: "
              f"{signal_counts['teams_with_matchup']}."
          )

          print(
              "Position matchups with historical "
              "play-caller data: "
              f"{signal_counts['play_caller_history']}."
          )

          print(
              "Position matchups without historical "
              "play-caller data: "
              f"{signal_counts['play_caller_no_history']}."
          )
          # -------------------------------------------------
          # FANTASYPROS EXPERT CONSENSUS RANKINGS
          # -------------------------------------------------

          fantasypros_api_key = os.environ.get(
              "FANTASYPROS_API_KEY"
          )

          expert_rankings = {}

          if fantasypros_api_key:
              print("Trying FantasyPros ECR data...")
              
              fp_url = (
                  "https://api.fantasypros.com/"
                  "public/v2/json/nfl/2026/"
                  "consensus-rankings"
                  "?scoring=PPR"
              )

              request = urllib.request.Request(
                  fp_url,
                  headers={
                      "x-api-key":
                          fantasypros_api_key
                  }
              )

              try:
                  with urllib.request.urlopen(
                      request
                  ) as response:
                      fp_data = json.loads(
                          response.read().decode(
                              "utf-8"
                          )
                      )

                  fp_players = fp_data.get(
                      "players",
                      []
                  )

                  print(
                      f"FantasyPros returned "
                      f"{len(fp_players)} players."
                  )

                  for player in fp_players:
                      name = player.get(
                          "player_name"
                      )

                      if not name:
                          continue

                      position = player.get(
                          "player_position_id"
                      )

                      if position not in {
                          "QB",
                          "RB",
                          "WR",
                          "TE"
                      }:
                          continue

                      expert_rankings[name] = {
                          "player_id":
                              player.get(
                                  "player_id"
                              ),
                          "team":
                              player.get(
                                  "player_team_id"
                              ),
                          "position":
                              position,
                          "rank_ecr":
                              player.get(
                                  "rank_ecr"
                              ),
                          "rank_min":
                              player.get(
                                  "rank_min"
                              ),
                          "rank_max":
                              player.get(
                                  "rank_max"
                              ),
                          "rank_ave":
                              player.get(
                                  "rank_ave"
                              ),
                          "rank_std":
                              player.get(
                                  "rank_std"
                              ),
                          "pos_rank":
                              player.get(
                                  "pos_rank"
                              )
                      }

              except Exception as error:
                  print(
                      "FantasyPros ECR unavailable: "
                      f"{error}"
                  )

          else:
              print(
                  "FANTASYPROS_API_KEY secret "
                  "not available."
              )

          print(
              f"Created expert ranking data "
              f"for {len(expert_rankings)} players."
          )
          output = {
              "season": season_used,
              "updated": datetime.now(
                  timezone.utc
              ).strftime("%Y-%m-%d"),
              "source": "nflverse",
              "players": rows,
              "defense_position_allowed":
                  defense_position_allowed,
              "team_next_opponent":
                  team_next_opponent,
              "current_play_caller_signals":
                  current_play_caller_signals,
              "play_caller_matchups":
                  play_caller_matchups,
              "player_vs_defensive_caller":
                  player_vs_defensive_caller,
              "expert_rankings":
                  expert_rankings
          }
          with open(
              "nfl-stats.json",
              "w",
              encoding="utf-8"
          ) as file:
              json.dump(
                  output,
                  file,
                  indent=2
              )

          print(
              f"Created nfl-stats.json with "
              f"{len(rows)} records "
              f"from the {season_used} season."
          )
          PY
          
      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add nfl-stats.json

          if git diff --cached --quiet; then
            echo "No stats changes to commit."
          else
            git commit -m "Update NFL player stats"
            git push
          fi
